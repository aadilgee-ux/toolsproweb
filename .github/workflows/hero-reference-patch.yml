name: Apply hero reference update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-reference-patch.yml'
permissions:
  contents: write
jobs:
  patch-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch hero only and validate
        env:
          HERO_CSS_B64: 
          HERO_HTML_B64: 
          HERO_HELPER_B64: 
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64,zlib,re,subprocess,xml.etree.ElementTree as ET
          p=Path('theme/toolsproweb-theme.xml')
          old=p.read_text(encoding='utf-8')
          expected='aab3324d16b3ee083d4fa5feb1cdd5e223a1fbd6'
          current=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          if current != expected:
              raise SystemExit(f'Theme changed unexpectedly: {current} != {expected}')
          dec=lambda k:zlib.decompress(base64.b64decode(__import__('os').environ[k])).decode()
          css=dec('HERO_CSS_B64'); html=dec('HERO_HTML_B64'); helper=dec('HERO_HELPER_B64')
          def strip_target(s):
              a=s.index('/* Hero */'); b=s.index('/* Stats */',a)
              s=s[:a]+'/* HERO_CSS_REMOVED */\n'+s[b:]
              a=s.index("<section class='hero' id='home'>"); b=s.index('<!-- ================= HERO SLIDER ================= -->',a)
              s=s[:a]+'<!-- HERO_HTML_REMOVED -->\n'+s[b:]
              s=re.sub(r"function heroRunSearch\(event\)\{.*?\n\}\nfunction heroGoCategory\(target\)\{.*?\n\}\n(?=function toggleTheme\(\)\{)", '', s, flags=re.S)
              return s
          new=old
          a=new.index('/* Hero */'); b=new.index('/* Stats */',a)
          new=new[:a]+css+new[b:]
          a=new.index("<section class='hero' id='home'>"); b=new.index('<!-- ================= HERO SLIDER ================= -->',a)
          new=new[:a]+html+'\n\n'+new[b:]
          if 'function heroRunSearch(event)' not in new:
              i=new.index('function toggleTheme(){')
              new=new[:i]+helper+new[i:]
          if strip_target(old) != strip_target(new):
              raise SystemExit('Safety check failed: content outside hero target changed')
          p.write_text(new,encoding='utf-8')
          ET.parse(p)
          print('XML valid; hero-only safety check passed')
          PYCODE
      - name: Commit hero update and remove temporary workflow
        run: |
          rm -f .github/workflows/hero-reference-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add theme/toolsproweb-theme.xml .github/workflows/hero-reference-patch.yml
          git commit -m 'Update homepage hero to reference design'
          git push
